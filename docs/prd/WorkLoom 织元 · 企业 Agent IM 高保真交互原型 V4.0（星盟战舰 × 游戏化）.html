<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkLoom 织元 · 企业 Agent IM 高保真交互原型 V4.0（星盟战舰 × 游戏化）</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============ 星盟战舰 STARLEAGUE · 设计令牌 ============ */
:root{
  --bg950:#04060F; --bg900:#050A1A; --bg800:#0A1230; --bg700:#121E45; --nebula:#241B4D;
  --gold:#FFB545; --gold2:#FF8A3D; --goldHi:#FFE0A3;
  --holo:#45E0FF; --holo2:#2FA8FF;
  --go:#3DFFB2; --warn:#FFC24D; --alert:#FF5470;
  --ink:#EAF1FF; --ink2:#9DB2DC; --ink3:#5E7099;
  --card:rgba(13,22,52,.72); --line:rgba(96,140,255,.22); --gline:rgba(255,181,69,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif;background:var(--bg950);color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",monospace}
.orb{font-family:"Orbitron","JetBrains Mono",monospace;letter-spacing:.05em}
::selection{background:rgba(255,181,69,.35)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--bg700);border-radius:8px}

/* ============ Demo 外壳 chrome ============ */
#chrome{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(4,6,15,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
#chrome .logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:15px;letter-spacing:.06em}
#chrome .logo .diam{width:16px;height:16px;transform:rotate(45deg);background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:4px;box-shadow:0 0 14px rgba(255,160,60,.6)}
#chrome .logo em{font-style:normal;background:linear-gradient(115deg,#FFF6E3,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
#chrome .crumb{font-size:12px;color:var(--ink3)} #chrome .crumb b{color:var(--ink2);font-weight:600}
#chrome select{background:var(--bg800);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;outline:none}
#chrome .sp{flex:1}
#mapBtn{background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;color:#2A1500;font-weight:800;font-size:12.5px;padding:7px 14px;border-radius:9px;cursor:pointer;letter-spacing:.08em}
#verTag{font-size:11px;color:var(--gold);border:1px solid var(--gline);border-radius:6px;padding:4px 9px;letter-spacing:.14em}
#mapPanel{display:none;position:fixed;inset:0;z-index:200;background:rgba(4,6,15,.82);backdrop-filter:blur(8px)}
#mapPanel .box{max-width:980px;margin:5vh auto;background:var(--bg900);border:1px solid var(--gline);border-radius:18px;padding:28px;max-height:88vh;overflow:auto}
#mapPanel h3{font-size:16px;margin-bottom:4px}#mapPanel .sub{font-size:12px;color:var(--ink3);margin-bottom:18px}
#mapPanel .grp{margin-bottom:16px}#mapPanel .grp b{display:block;font-size:12px;color:var(--holo);letter-spacing:.2em;margin-bottom:8px}
#mapPanel .pbtn{display:inline-block;margin:0 8px 8px 0;padding:8px 13px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;color:var(--ink2);cursor:pointer;background:var(--card)}
#mapPanel .pbtn:hover{border-color:var(--gold);color:var(--goldHi)}
#mapPanel .pbtn .eid{color:var(--ink3);font-size:10.5px;margin-left:6px}
#tooltip{position:fixed;z-index:300;pointer-events:none;display:none;background:#0A1230;border:1px solid var(--gold);color:var(--goldHi);font-size:11.5px;padding:6px 11px;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.6);white-space:nowrap}
[data-go]{cursor:pointer;transition:box-shadow .18s,border-color .18s}
[data-go]:hover{box-shadow:0 0 0 1.5px var(--gold),0 0 22px rgba(255,160,60,.28)!important}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:300;display:none;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2A1500;font-weight:800;font-size:13.5px;padding:11px 22px;border-radius:12px;box-shadow:0 8px 34px rgba(255,138,61,.5)}
#stage{padding:26px 20px 60px;display:flex;flex-direction:column;align-items:center}
#stageBg{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(1100px 620px at 85% -5%, rgba(58,42,110,.5), transparent 60%),
  radial-gradient(900px 700px at -10% 30%, rgba(18,30,69,.65), transparent 60%),
  radial-gradient(760px 520px at 60% 112%, rgba(255,138,61,.07), transparent 60%), var(--bg950)}
#stageBg::after{content:"";position:absolute;inset:0;background-image:
  radial-gradient(1.5px 1.5px at 22% 18%, #fff, transparent),radial-gradient(1.1px 1.1px at 68% 8%, #cfe4ff, transparent),
  radial-gradient(1.7px 1.7px at 84% 32%, #ffe9c4, transparent),radial-gradient(1px 1px at 40% 46%, #fff, transparent),
  radial-gradient(1.4px 1.4px at 12% 62%, #cfe4ff, transparent),radial-gradient(1.2px 1.2px at 56% 72%, #fff, transparent),
  radial-gradient(1.8px 1.8px at 90% 78%, #ffe9c4, transparent),radial-gradient(1px 1px at 30% 88%, #fff, transparent);
  animation:drift 90s linear infinite alternate}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-50px)}}

/* ============ 应用框架（舰桥窗口） ============ */
.frame{width:1180px;background:linear-gradient(170deg,rgba(10,18,48,.92),rgba(5,10,26,.96));border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.frame::before,.frame::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--gold);z-index:5;pointer-events:none}
.frame::before{top:-1px;left:-1px;border-right:none;border-bottom:none;border-radius:20px 0 0 0}
.frame::after{top:-1px;right:-1px;border-left:none;border-bottom:none;border-radius:0 20px 0 0}
.frame .bc{position:absolute;bottom:-1px;width:18px;height:18px;border:2px solid var(--gold);z-index:5;pointer-events:none}
.frame .bc.l{left:-1px;border-right:none;border-top:none;border-radius:0 0 0 20px}
.frame .bc.r{right:-1px;border-left:none;border-top:none;border-radius:0 0 20px 0}

/* 应用内顶栏 */
.abar{display:flex;align-items:center;gap:14px;padding:11px 18px;border-bottom:1px solid var(--line);background:rgba(5,10,26,.7)}
.ws-sw{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:700}
.ws-sw .ship{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,var(--bg700),var(--nebula));border:1px solid var(--gline);display:flex;align-items:center;justify-content:center;font-size:15px}
.ws-sw .st{font-size:10.5px;color:var(--go);border:1px solid rgba(61,255,178,.4);padding:2px 7px;border-radius:5px;font-weight:600}
.ws-sw .node{font-size:10.5px;color:var(--ink3)}
.ws-sw .node i{color:var(--go);font-style:normal}
.abar .sp{flex:1}
.captain{display:flex;align-items:center;gap:9px}
.captain .avt{width:30px;height:30px;border-radius:50%;background:linear-gradient(150deg,#3A2A6E,#121E45);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:14px}
.captain .nm{font-size:12px;font-weight:700}
.captain .lv{font-family:"Orbitron";font-size:11px;color:var(--goldHi);font-weight:700}
.captain .xp{width:74px;height:5px;border-radius:5px;background:rgba(96,140,255,.16);overflow:hidden;margin-top:3px}
.captain .xp i{display:block;height:100%;width:89%;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.night-pill{display:flex;align-items:center;gap:8px;border:1px solid rgba(69,224,255,.4);background:rgba(69,224,255,.07);border-radius:999px;padding:6px 13px;font-size:11.5px}
.night-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--holo);box-shadow:0 0 10px var(--holo);animation:pulse 1.6s infinite}
.night-pill b{color:var(--holo)}
.night-pill.paused{border-color:rgba(255,194,77,.45);background:rgba(255,194,77,.07)}
.night-pill.paused .dot{background:var(--warn);box-shadow:0 0 10px var(--warn);animation:pulse 2.4s infinite}
.night-pill.paused b{color:var(--warn)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.7}}

/* 三栏 IM 布局 */
.im3{display:grid;grid-template-columns:236px 1fr 264px;min-height:640px}
.side{border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:4px;background:rgba(5,10,26,.45)}
.side .grp-t{font-size:10.5px;color:var(--ink3);letter-spacing:.2em;padding:10px 10px 5px}
.conv{display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid transparent}
.conv:hover{background:rgba(96,140,255,.06)}
.conv.act{background:rgba(255,181,69,.08);border-color:var(--gline)}
.conv .cav{width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;background:linear-gradient(150deg,var(--bg700),var(--nebula));border:1px solid var(--line);position:relative}
.conv .nm{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .pv{font-size:10.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.conv .bdg{margin-left:auto;background:var(--alert);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.sdot{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg900)}
.sdot.run{background:var(--holo);box-shadow:0 0 8px var(--holo);animation:pulse 1.6s infinite}
.sdot.wait{background:var(--warn)} .sdot.done{background:var(--go)} .sdot.err{background:var(--alert)} .sdot.off{background:var(--ink3)}
.flow{padding:16px 20px;display:flex;flex-direction:column;gap:12px;background:radial-gradient(600px 300px at 50% -60px, rgba(58,42,110,.28), transparent 70%)}
.ctx{border-left:1px solid var(--line);padding:14px 14px;display:flex;flex-direction:column;gap:12px;background:rgba(5,10,26,.45)}
.ctx .ct{font-size:10.5px;color:var(--ink3);letter-spacing:.2em}

/* 派遣栏 = 航线设定台 */
.dispatch{margin:0 16px 16px;display:flex;gap:11px;align-items:center;background:rgba(8,14,34,.92);border:1px solid var(--gline);border-radius:15px;padding:9px 9px 9px 16px;box-shadow:0 0 30px rgba(255,160,60,.1)}
.dispatch .rico{width:32px;height:32px;border-radius:10px;background:radial-gradient(circle at 35% 30%,var(--goldHi),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 0 16px rgba(255,160,60,.5);flex:none}
.dispatch .in{flex:1;min-width:0}
.dispatch .in .txt{font-size:13.5px;color:var(--ink2)}
.dispatch .in .chips{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.cchip{font-size:10.5px;color:var(--holo);border:1px solid rgba(69,224,255,.35);border-radius:6px;padding:2px 8px;background:rgba(69,224,255,.06)}
.mpills{display:flex;gap:5px;flex:none}
.mpills span{font-size:11px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
.mpills span.on{border-color:var(--gold);color:var(--goldHi);background:rgba(255,181,69,.12);box-shadow:0 0 12px rgba(255,181,69,.22)}
.btn-launch{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2A1500;font-weight:800;font-size:13.5px;border:none;border-radius:11px;padding:11px 22px;letter-spacing:.08em;box-shadow:0 4px 20px rgba(255,138,61,.42);position:relative;overflow:hidden;flex:none}
.btn-launch::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.5),transparent);animation:sheen 2.6s ease-in-out infinite}
@keyframes sheen{0%{left:-70%}55%{left:130%}100%{left:130%}}
.btn-dis{background:var(--bg700)!important;color:var(--ink3)!important;box-shadow:none!important}

/* ============ 消息流卡片 ============ */
.msg{display:flex;gap:11px}
.msg .mav{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;background:linear-gradient(150deg,var(--bg700),var(--nebula));border:1px solid var(--line)}
.msg .mbd{flex:1;min-width:0}
.msg .mhd{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.msg .mhd b{font-size:12.5px}
.msg .mhd .tm{font-size:10.5px;color:var(--ink3)}
.msg .mhd .ver{font-family:"JetBrains Mono";font-size:10px;color:var(--holo)}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:11px 14px;font-size:12.8px;line-height:1.85;color:var(--ink2)}
.bubble b,.bubble strong{color:var(--ink)}
.bubble.gold{border-color:var(--gline);background:linear-gradient(150deg,rgba(255,181,69,.07),rgba(13,22,52,.7))}
.bubble.red{border-color:rgba(255,84,112,.5);background:linear-gradient(150deg,rgba(255,84,112,.07),rgba(13,22,52,.7))}
.eid{font-family:"JetBrains Mono";font-size:10.5px;color:var(--holo);white-space:nowrap}
.rcp{font-size:10px;padding:2px 8px;border-radius:5px;margin-left:6px;white-space:nowrap}
.rcp.ok{color:var(--go);background:rgba(61,255,178,.1);border:1px solid rgba(61,255,178,.3)}
.rcp.wait{color:var(--warn);background:rgba(255,194,77,.1);border:1px solid rgba(255,194,77,.3)}
.rcp.err{color:var(--alert);background:rgba(255,84,112,.1);border:1px solid rgba(255,84,112,.35)}
.sysline{display:flex;align-items:center;gap:12px;margin:4px 0}
.sysline::before,.sysline::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.sysline span{font-size:10.5px;color:var(--ink3);letter-spacing:.1em;white-space:nowrap}
.tagline{font-size:10.5px;color:var(--ink3);margin-top:6px;line-height:1.7}
.tagline .eid{color:var(--holo)}

/* 战报卡（交接班） */
.report{border:1px solid var(--gline);border-radius:16px;overflow:hidden;background:linear-gradient(160deg,rgba(36,27,77,.5),rgba(10,18,48,.9));box-shadow:0 0 34px rgba(255,160,60,.08)}
.report .rh{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.report .rh b{font-size:14px}
.report .rh .orb{font-size:10px;color:var(--holo)}
.report .rh .mete{font-size:10.5px;color:var(--ink3)}
.rcols{display:grid;grid-template-columns:repeat(3,1fr)}
.rcol{padding:15px 10px;text-align:center}
.rcol+.rcol{border-left:1px solid rgba(96,140,255,.12)}
.rcol .n{font-family:"Orbitron";font-size:30px;font-weight:900}
.rcol:nth-child(1) .n{color:var(--go);text-shadow:0 0 22px rgba(61,255,178,.5)}
.rcol:nth-child(2) .n{color:var(--warn);text-shadow:0 0 22px rgba(255,194,77,.5)}
.rcol:nth-child(3) .n{color:var(--alert);text-shadow:0 0 22px rgba(255,84,112,.5)}
.rcol .l{font-size:11px;color:var(--ink2);margin-top:3px;letter-spacing:.1em}
.rfoot{padding:10px 16px;border-top:1px solid var(--line);font-size:10.8px;color:var(--ink3);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.btn-ghost{border:1px solid var(--gline);color:var(--goldHi);background:rgba(255,181,69,.08);font-size:11.5px;padding:6px 13px;border-radius:9px;font-weight:700}

/* KPI 全息仪表 */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:linear-gradient(160deg,rgba(10,18,48,.85),rgba(8,14,34,.9));border:1px solid rgba(69,224,255,.28);border-radius:13px;padding:12px 14px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(69,224,255,.03) 3px 4px);pointer-events:none}
.kpi .kl{font-size:10.5px;color:var(--ink2);letter-spacing:.12em}
.kpi .kv{font-family:"Orbitron";font-size:22px;font-weight:700;margin:5px 0 3px}
.kpi .kd{font-size:11px;font-weight:700}
.up{color:var(--go)} .dn{color:var(--alert)}
.kpi.grey{opacity:.55;filter:grayscale(.6)}

/* 巡检雷达推送 */
.radar-card{border:1px solid rgba(255,84,112,.4);border-radius:14px;background:linear-gradient(150deg,rgba(255,84,112,.06),rgba(13,22,52,.7));padding:13px 16px;position:relative;overflow:hidden}
.radar-card .sweep{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:conic-gradient(from 0deg,rgba(69,224,255,.16),transparent 60deg);animation:sweep 4s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.sev{font-size:10px;font-weight:800;padding:2px 8px;border-radius:5px;letter-spacing:.1em}
.sev.p0{background:rgba(255,84,112,.18);color:var(--alert);border:1px solid rgba(255,84,112,.5)}
.sev.p1{background:rgba(255,194,77,.14);color:var(--warn);border:1px solid rgba(255,194,77,.45)}
.sev.p2{background:rgba(69,224,255,.12);color:var(--holo);border:1px solid rgba(69,224,255,.4)}

/* 任务卡 / XP */
.pill-main{font-size:10px;font-weight:800;letter-spacing:.12em;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2A1500;padding:3px 9px;border-radius:5px}
.pill-mode{font-size:10px;border:1px solid var(--holo);color:var(--holo);padding:3px 9px;border-radius:5px;letter-spacing:.08em}
.pill-review{font-size:10px;border:1px solid var(--warn);color:var(--warn);padding:3px 9px;border-radius:5px}
.pill-done{font-size:10px;border:1px solid var(--go);color:var(--go);padding:3px 9px;border-radius:5px}
.pill-err{font-size:10px;border:1px solid var(--alert);color:var(--alert);padding:3px 9px;border-radius:5px}
.xpbar{height:9px;border-radius:99px;background:rgba(96,140,255,.14);overflow:hidden;position:relative;flex:1}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold2),var(--gold),var(--goldHi));box-shadow:0 0 12px rgba(255,181,69,.55);position:relative}
.xpbar i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 8px,rgba(255,255,255,.16) 8px 10px);animation:flow 1.2s linear infinite}
@keyframes flow{to{transform:translateX(20px)}}
.mile{display:flex;gap:5px}
.mile span{flex:1;height:4px;border-radius:4px;background:rgba(96,140,255,.16)}
.mile span.done{background:var(--gold);box-shadow:0 0 7px rgba(255,181,69,.7)}

/* 审批卡（原生消息） */
.appr{border:1px solid var(--gline);border-radius:15px;background:linear-gradient(160deg,rgba(18,30,69,.9),rgba(10,18,48,.88));overflow:hidden}
.appr .ah{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.appr .ah b{font-size:13px}
.appr .bd{padding:13px 15px}
.diff{width:100%;border-collapse:collapse;font-size:12px}
.diff td{padding:7px 10px;border-bottom:1px solid rgba(96,140,255,.1);color:var(--ink2)}
.diff td:first-child{color:var(--ink3);white-space:nowrap}
.diff .old{text-decoration:line-through;color:var(--ink3)}
.diff .new{color:var(--goldHi);font-weight:700}
.levers{display:flex;gap:9px;padding:12px 15px;border-top:1px solid var(--line)}
.lev{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 8px;border-radius:11px;border:1px solid;font-size:12.5px;font-weight:800}
.lev small{display:block;font-size:9.5px;font-weight:400;opacity:.8}
.lev.go{border-color:rgba(61,255,178,.55);color:var(--go);background:rgba(61,255,178,.08)}
.lev.cal{border-color:rgba(69,224,255,.5);color:var(--holo);background:rgba(69,224,255,.06)}
.lev.brk{border-color:rgba(255,84,112,.55);color:var(--alert);background:rgba(255,84,112,.07)}

/* 需介入卡 */
.need{border:1px solid rgba(255,84,112,.5);border-radius:14px;background:linear-gradient(150deg,rgba(255,84,112,.08),rgba(13,22,52,.75));padding:12px 15px}

/* ctx 面板小卡 */
.xcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px}
.xcard .xt{font-size:11px;color:var(--ink2);font-weight:700;letter-spacing:.08em;margin-bottom:9px}

<script>
/* ================= 路由 / 接线 / 地图 ================= */
const stage=document.getElementById('stage');
const pageSel=document.getElementById('pageSel'), stateSel=document.getElementById('stateSel');
const pageOf=id=>id.split('_')[0];
function fillSels(cur){
  const pages=[...new Set(ORDER.map(pageOf))];
  pageSel.innerHTML=pages.map(p=>`<option value="${p}" ${p===pageOf(cur)?'selected':''}>${META[p][0]}</option>`).join('');
  const sts=ORDER.filter(id=>pageOf(id)===pageOf(cur));
  stateSel.innerHTML=sts.map(id=>`<option value="${id}" ${id===cur?'selected':''}>${META[id][1]}</option>`).join('');
}
function render(){
  let id=(location.hash||'#p1').slice(1);
  if(!SCREENS[id]) id='p1';
  stage.innerHTML=SCREENS[id]();
  document.getElementById('crumb').innerHTML=`<b>${META[id][0]}</b> · ${META[id][1]} · ${META[id][2]}`;
  fillSels(id);
  stage.scrollIntoView();
}
window.addEventListener('hashchange',render);
pageSel.onchange=e=>location.hash=e.target.value;
stateSel.onchange=e=>location.hash=e.target.value;
/* data-go 委托 + tooltip */
const tip=document.getElementById('tooltip');
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){location.hash=g.dataset.go;toast('跃迁 → '+META[g.dataset.go][0]);return;}
  const b=e.target.closest('button,.lev,.mbtn,.cchip');
  if(b&&!b.closest('#chrome')&&!b.id){toast('演示接线：该动作在 PRD 中有明确定义（见元素交互说明）');}
});
document.addEventListener('mouseover',e=>{
  const g=e.target.closest('[data-go]');
  if(g&&g.dataset.tip){tip.style.display='block';tip.textContent='⇢ '+g.dataset.tip;}
  else tip.style.display='none';
});
document.addEventListener('mousemove',e=>{tip.style.left=(e.clientX+16)+'px';tip.style.top=(e.clientY+14)+'px';});
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',1800);}
/* 页面地图 */
const mapPanel=document.getElementById('mapPanel');
document.getElementById('mapBtn').onclick=()=>{mapPanel.style.display='block';
  document.getElementById('mapBody').innerHTML=GROUPS.map(g=>`<div class="grp"><b>${g}</b>${ORDER.filter(id=>META[id][2]===g).map(id=>`<span class="pbtn" data-go="${id}">${META[id][0].split('·')[0]}<span class="eid">${id}</span></span>`).join('')}</div>`).join('');};
mapPanel.onclick=e=>{if(e.target===mapPanel||e.target.closest('[data-go]'))mapPanel.style.display='none';};
render();
</script>
